      content: <p><span style="font-family:Signika, sans-serif">Lose any remaining attacks this round (including attacks of opportunity) and gain the Dislocated Shoulder condition on your throwing arm.</span></p><p></p><p>You cannot make attacks or attempt skills that require the use of the affected arm.</p><p></p><p>A dislocated shoulder can be relocated with a DC 10 Heal check. You take 1d4 nonlethal damage for each attempt made, successful or not.</p>
