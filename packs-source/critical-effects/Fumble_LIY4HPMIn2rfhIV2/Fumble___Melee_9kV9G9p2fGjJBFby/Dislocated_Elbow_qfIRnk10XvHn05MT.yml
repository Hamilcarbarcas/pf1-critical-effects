    text:
      content: <p><span style="font-family:Signika, sans-serif">Lose any remaining attacks this round (including attacks of opportunity) and gain the Dislocated Elbow condition. If wielding a two-handed weapon, roll randomly to determine which hand is affected.</span></p><p></p><p>Any attacks or skill checks that require the use of the affected arm are rolled with disadvantage.</p><p></p><p>A dislocated elbow can be relocated with a DC 10 Heal check. You take 1d4 nonlethal damage for each attempt made, successful or not.</p>
