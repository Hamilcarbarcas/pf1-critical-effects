    text:
      content: <p><span style="font-family:Signika, sans-serif">Gain the broken hand condition. Roll randomly to determine which hand is affected.</span></p><p>A -4 penalty is applied to all attacks or skills that make use of that hand.</p><p>Whenever a broken hand is used in an attack or skill check, make a DC 10 Fortitude save. Failure turns the broken hand into a fractured hand.</p><p></p><p>A broken hand can be healed by making a DC 10 heal check to set the bone, followed by 10 points of healing dedicated to the break (dedicated healing does not heal hit point damage).</p>
