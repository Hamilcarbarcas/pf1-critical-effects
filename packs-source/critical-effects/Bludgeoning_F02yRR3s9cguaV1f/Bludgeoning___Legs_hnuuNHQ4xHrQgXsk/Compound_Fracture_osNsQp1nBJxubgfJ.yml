    text:
      content: <p><span style="font-family:Signika, sans-serif">Gain the broken leg condition and 1d8 bleed. Roll randomly to determine which leg is affected.A -4 penalty is applied to AC, movement rates are halved, you cannot run or charge, and any skills requiring footwork are made with disadvantage.A broken leg can be healed by making a DC 15 Heal check to set the bone, followed by 15 HP of healing dedicated to the break (dedicated healing does not heal hit point damage).</span></p><p><span style="font-family:Signika, sans-serif">Bleed damage is applied at the beginning of each turn until stopped with a DC 15 Heal check or receiving 1 or more points of hit point healing.</span></p>
