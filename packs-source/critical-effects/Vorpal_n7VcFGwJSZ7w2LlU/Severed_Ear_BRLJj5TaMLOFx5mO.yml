    text:
      content: <p>Gain 1d4 bleed.</p><p></p><p>All checks requiring hearing are made with disadvantage.</p><p></p><p><span style="font-family:Signika, sans-serif">If the ear can be recovered, it can be reattached by making a DC 20 Heal check within 10 minutes of the loss, followed by 15 HP of healing dedicated to the ear (dedicated healing does not heal hit point damage).</span></p><p></p><p><span style="font-family:Signika, sans-serif">The effect remains until the character grows accustomed to the loss of the ear. A DC 20 Wisdom check can be made each day to attempt to normalize to their new state, removing the associated penalties.</span></p><p></p><p><span style="font-family:Signika, sans-serif">Bleed damage is applied at the beginning of each turn until stopped with a DC 15 Heal check or receiving 1 or more points of hit point healing.</span></p>
