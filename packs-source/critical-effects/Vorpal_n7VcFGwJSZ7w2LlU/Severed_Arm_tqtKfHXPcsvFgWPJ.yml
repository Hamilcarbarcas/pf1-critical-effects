    text:
      content: <p>Lose an arm and gain 1d10 bleed. Roll randomly to see which arm is affected.</p><p></p><p>A severed arm is cut somewhere between the elbow and shoulder.</p><p></p><p>If the arm can be recovered, it can be reattached by making a DC 25 Heal check within 10 minutes of the loss, followed by 40 HP of healing dedicated to the arm <span style="font-family:Signika, sans-serif">(dedicated healing does not heal hit point damage).</span></p><p></p><p>Partial to total use of a lost arm can be regained via the use of a prosthesis.</p>
