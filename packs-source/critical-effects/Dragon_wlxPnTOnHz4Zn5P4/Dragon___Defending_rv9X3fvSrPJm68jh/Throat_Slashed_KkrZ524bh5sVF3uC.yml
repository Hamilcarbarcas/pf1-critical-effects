    text:
      content: <p><span style="font-family:Signika, sans-serif">Gain the Throat Slashed condition and 2d8 bleed.</span></p><p></p><p>You cannot speak above a whisper.</p><p></p><p><span style="font-family:Signika, sans-serif">When casting spells with somatic components, you must make a concentration check (DC 15 + double the level of the spell you’re casting) to succeed. You lose the spell if you fail.</span></p><p></p><p>The throat slashed condition can be healed with 20 HP of healing dedicated to it <span style="font-family:Signika, sans-serif">(dedicated healing does not heal hit point damage).</span></p><p></p><p><span style="font-family:Signika, sans-serif">Bleed damage is applied at the beginning of each turn until stopped with a DC 15 Heal check or receiving 1 or more points of hit point healing.</span></p>
