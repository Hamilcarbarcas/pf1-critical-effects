    text:
      content: <p>Gain the broken finger condition. Roll randomly to determine which hand is affected.</p><p></p><p>All skill checks using that hand are made with disadvantage.</p><p></p><p>If 2 or more fingers are broken on one hand, they are replaced with the broken hand condition.</p><p></p><p><span style="font-family:Signika, sans-serif">A broken finger can be healed by making a DC 10 Heal check to set the bone, followed by 5 HP of healing dedicated to the break (dedicated healing does not heal hit point damage).</span></p>
