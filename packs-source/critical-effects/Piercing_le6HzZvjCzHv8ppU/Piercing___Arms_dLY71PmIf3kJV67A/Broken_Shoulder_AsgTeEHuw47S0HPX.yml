    text:
      content: <p>Gain the Broken Shoulder condition. Roll randomly to determine which arm is affected.</p><p></p><p>The affected arm is useless, and any rolls involving its use automatically fail. Some work involving only hand movements (such as disable device) may ignore this penalty, at DM discretion.</p><p></p><p>A broken shoulder can be healed by making a DC 20 heal check, followed by 20 HP of healing dedicated to the break (dedicated healing does not heal hit point damage).</p>
