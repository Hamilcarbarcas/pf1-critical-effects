    text:
      content: <p>Lose 1d4 toes and gain 1 bleed. Roll randomly to determine which foot is affected.</p><p></p><p>Movement rates are halved.</p><p></p><p>If the toes are recovered, they can be reattached by making a DC 15 Heal check within 10 minutes of the loss, followed by 5 HP of healing dedicated to each toe lost <span style="font-family:Signika, sans-serif">(dedicated healing does not heal hit point damage).</span></p><p></p><p>If the toes are not recovered, the effects remain until the character grows accustomed to the loss of those toes. A Wisdom check can be made each day to attempt to normalize to their new state. The base DC is 10, +1 for each toe lost.</p><p></p><p><span style="font-family:Signika, sans-serif">Bleed damage is applied at the beginning of each turn until stopped with a DC 15 Heal check or receiving 1 or more points of hit point healing.</span></p>
