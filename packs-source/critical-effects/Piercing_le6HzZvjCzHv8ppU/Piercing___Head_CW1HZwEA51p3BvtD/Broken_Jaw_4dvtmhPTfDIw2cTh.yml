    text:
      content: <p>Gain the Broken Jaw condition.</p><p></p><p>All skills requiring speech are made with disadvantage.</p><p></p><p>When casting spells with somatic components, you must make a concentration check (DC 15 + double the level of the spell you’re casting) to succeed. You lose the spell if you fail.</p><p></p><p><span style="font-family:Signika, sans-serif">A broken jaw can be healed by making a DC 10 Heal check to set the bone, followed by 15 HP of healing dedicated to the break (dedicated healing does not heal hit point damage).</span></p>
