    text:
      content: <p>Lose an eye. Roll randomly to determine which eye is lost.</p><p></p><p>All skills requiring sight, as well as attack rolls and reflex saves are made with a -2 penalty.</p><p></p><p><span style="font-family:Signika, sans-serif">All intimidate checks are made with advantage.</span></p><p></p><p>The effects remain until the character grows accustomed to the loss of an eye. A DC 20 <span style="font-family:Signika, sans-serif">Wisdom check can be made each day to attempt to normalize to their new state, removing the associated penalties.</span></p>
