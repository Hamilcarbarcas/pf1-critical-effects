    text:
      content: <p><span style="font-family:Signika, sans-serif">Gain the Pierced Mouth condition.</span></p><p></p><p>All charisma-based checks are made with disadvantage.</p><p></p><p><span style="font-family:Signika, sans-serif">When casting spells with somatic components, you must make a concentration check (DC 15 + double the level of the spell you’re casting) to succeed. You lose the spell if you fail.</span></p><p></p><p><span style="font-family:Signika, sans-serif">The pierced mouth condition can be healed with 10 HP of healing dedicated to it (dedicated healing does not heal hit point damage).</span></p>
