    text:
      content: <p>Gain the broken knee condition.<span style="font-family:Signika, sans-serif"> Roll randomly to determine which leg is affected.</span></p><p></p><p><span style="font-family:Signika, sans-serif">A -6 penalty is applied to AC, movement is reduced to 5 feet (or half normal with the use of crutches), you cannot run or charge, and any skills requiring footwork automatically fail.</span></p><p></p><p><span style="font-family:Signika, sans-serif">A broken knee can be healed by making a DC 20 Heal check to set the bone, followed by 20 HP of healing dedicated to the break (dedicated healing does not heal hit point damage).</span></p>
