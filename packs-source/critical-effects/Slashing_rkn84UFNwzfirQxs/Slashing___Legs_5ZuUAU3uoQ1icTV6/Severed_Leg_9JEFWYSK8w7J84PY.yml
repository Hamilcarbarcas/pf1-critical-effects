    text:
      content: <p>Lose a leg and gain 1d10 bleed. Roll randomly to see which foot is affected.</p><p></p><p><span style="font-family:Signika, sans-serif">A -6 penalty is applied to AC, movement is reduced to 5 feet (or half normal with the use of crutches), you cannot run or charge, and any skills requiring footwork automatically fail.</span></p><p></p><p>A severed leg is cut somewhere between the knee and hip.</p><p></p><p>If the leg can be recovered, it can be reattached by making a DC 25 Heal check within 10 minutes of the loss, followed by 45 HP of healing dedicated to the leg <span style="font-family:Signika, sans-serif">(dedicated healing does not heal hit point damage).</span></p><p></p><p><span style="font-family:Signika, sans-serif">Bleed damage is applied at the beginning of each turn until stopped with a DC 15 Heal check or receiving 1 or more points of hit point healing.</span></p><p></p><p>Partial to total use of a lost leg can be regained via the use of a prosthesis.</p>
