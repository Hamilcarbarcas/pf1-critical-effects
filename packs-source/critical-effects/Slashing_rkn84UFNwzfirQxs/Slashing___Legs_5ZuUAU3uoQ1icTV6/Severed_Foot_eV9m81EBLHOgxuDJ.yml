    text:
      content: <p>Lose a foot and gain 1d6 bleed. Roll randomly to see which foot is affected.</p><p></p><p><span style="font-family:Signika, sans-serif">A -4 penalty is applied to AC, movement is reduced to 5 feet (or half normal with the use of crutches), you cannot run or charge, and any skills requiring footwork automatically fail.</span></p><p></p><p>A severed foot is cut somewhere between the ankle and knee.</p><p></p><p>If the foot can be recovered, it can be reattached by making a DC 25 Heal check within 10 minutes of the loss, followed by 35 HP of healing dedicated to the foot <span style="font-family:Signika, sans-serif">(dedicated healing does not heal hit point damage).</span></p><p></p><p><span style="font-family:Signika, sans-serif">Bleed damage is applied at the beginning of each turn until stopped with a DC 15 Heal check or receiving 1 or more points of hit point healing.</span></p><p></p><p>Partial to total use of a lost foot can be regained via the use of a prosthesis.</p>
