    text:
      content: <p>Gain the Broken Arm condition and 1d6 bleed. Roll randomly to determine which arm is affected.</p><p></p><p>A -6 penalty is applied to all attacks or skills that make use of that arm.</p><p></p><p>A broken arm can be healed by making a DC 10 Heal check to set the bone, followed by 10 HP of healing dedicated to the break (dedicated healing does not heal hit point damage).</p><p></p><p>Bleed damage is applied at the beginning of each turn until stopped with a DC 15 Heal check or receiving 1 or more points of hit point healing.</p>
