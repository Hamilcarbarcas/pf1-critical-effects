    text:
      content: <p>Lose a hand and gain 1d8 bleed. Roll randomly to see which hand is affected.</p><p></p><p>A severed hand is cut somewhere between the wrist and elbow.</p><p></p><p>If the hand can be recovered, it can be reattached by making a DC 25 Heal check within 10 minutes of the loss, followed by 30 HP of healing dedicated to the hand <span style="font-family:Signika, sans-serif">(dedicated healing does not heal hit point damage).</span></p><p></p><p><span style="font-family:Signika, sans-serif">Bleed damage is applied at the beginning of each turn until stopped with a DC 15 Heal check or receiving 1 or more points of hit point healing.</span></p><p></p><p>Partial to total use of a lost hand can be regained via the use of a prosthesis.</p>
