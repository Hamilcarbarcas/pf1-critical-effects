    text:
      content: <p>Gain the punctured lung condition and 1d8 bleed.</p><p></p><p>Exhausted until cured, and talking requires a DC 15 Fortitude save, coughing up blood instead on a failure.</p><p></p><p><span style="font-family:Signika, sans-serif">The effects of a punctured lung can be removed with 15 HP of dedicated healing to it (dedicated healing does not heal hit point damage).</span></p><p></p><p><span style="font-family:Signika, sans-serif">Bleed damage is applied at the beginning of each turn until stopped with a DC 15 Heal check or receiving 1 or more points of hit point healing.</span></p>
