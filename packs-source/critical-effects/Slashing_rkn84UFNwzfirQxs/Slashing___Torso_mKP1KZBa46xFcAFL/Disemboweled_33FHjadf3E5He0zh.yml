    text:
      content: <p>Gain the Disemboweled condition and 1d12 bleed.</p><p></p><p>Staggered until cured.</p><p></p><p>A disembowel can be cured by pushing the innards back into the body as a standard action (requires a DC 15 Fortitude save to do it yourself), followed by a DC 20 heal check or 10 points of dedicated healing to seal the wound <span style="font-family:Signika, sans-serif">(dedicated healing does not heal hit point damage).</span></p><p></p><p><span style="font-family:Signika, sans-serif">Bleed damage is applied at the beginning of each turn until stopped with a DC 15 Heal check or receiving 1 or more points of hit point healing.</span></p>
