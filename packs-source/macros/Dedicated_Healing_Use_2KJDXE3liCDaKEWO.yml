command: |-
  if (action.name === "Set Bone") {
    game.criticalEffects.dedicatedHealing.requestBoneSetting(actor, item);
    shared.hideChat = false;
  } else if (action.name.startsWith("Use ")) {
    const dc = item.getItemDictionaryFlag("useFortSave");

    actor.rollSavingThrow("fort", { skipDialog: false, dc }).then(async (saveResult) => {
      if (!saveResult) return;

      const total = saveResult.rolls?.[0]?.total;
      if (total === undefined) return ui.notifications.warn("Could not read fort save result.");

      if (total >= dc) return;

      const fracturedName = item.name.replace("Broken", "Fractured");

      const confirmed = await foundry.applications.api.DialogV2.confirm({
        window: { title: "Fort Save Failed" },
        content: `<p>Fort save failed (rolled <strong>${total}</strong> vs DC <strong>${dc}</strong>).</p>
                  <p>Disable <strong>${item.name}</strong> and apply <strong>${fracturedName}</strong>?</p>`,
      });

      if (!confirmed) return;

      await item.update({ "system.active": false });

      let fracturedBuff = actor.items.find(i => i.type === "buff" && i.name === fracturedName);

      if (!fracturedBuff) {
        const preferredPackIds = ["pf1-critical-effects.effect-buffs"];

        const findInPacks = async (packs) => {
          for (const pack of packs) {
            if (pack.documentName !== "Item") continue;
            const docs = await pack.getDocuments();
            const found = docs.find(d => d.type === "buff" && d.name.toLowerCase() === fracturedName.toLowerCase());
            if (found) return found;
          }
          return null;
        };

        let packBuff = await findInPacks(game.packs.filter(p => preferredPackIds.includes(p.collection)));

        if (!packBuff) {
          const preferredSet = new Set(preferredPackIds);
          packBuff = await findInPacks(game.packs.filter(p => p.documentName === "Item" && !preferredSet.has(p.collection)));
        }

        if (packBuff) {
          ui.notifications.info(`Adding "${fracturedName}" to ${actor.name}...`);
          const [created] = await actor.createEmbeddedDocuments("Item", [packBuff.toObject()]);
          fracturedBuff = created;
        } else {
          return ui.notifications.warn(`Buff "${fracturedName}" not found on ${actor.name} or in any compendium.`);
        }
      }

      await fracturedBuff.update({ "system.active": true });
    });
  }
