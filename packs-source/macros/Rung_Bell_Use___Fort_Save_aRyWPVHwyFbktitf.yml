command: |-
  // ===========================================================================
  // Save to Shake It Off — using the buff's action rolls a Fortitude save against
  // the DC the critical was delivered at. Success ends the buff; failure does
  // nothing (the effect rides on until the next attempt).
  //
  // ATTACH AS: a "Use" script call on the BUFF itself.
  // IN SCOPE:  item (the buff), actor, shared.
  // PREREQ:    delivered by critical-effects / Buff Delivery so the buff carries
  //            flags.astora-mod.sourceInfo.saveDC.
  // ===========================================================================

  const SAVE_ID     = "fort";                  // "fort" | "ref" | "will"
  const SKIP_DIALOG = !actor?.hasPlayerOwner;  // NPC/unowned auto-rolls skip the prompt

  if (!actor || !item) return;

  // DC from the delivery stamp; roll-data mirror as a fallback so this doesn't
  // depend on the libWrapper accessor being live.
  const info = item.getFlag("astora-mod", "sourceInfo") ?? item.getRollData()?.sourceInfo ?? {};
  const dc = Number(info.saveDC);
  if (!Number.isFinite(dc)) {
    ui.notifications.warn(`${item.name}: no save DC stamped on this buff — no save rolled.`);
    return;
  }

  // dc flows through to the card, so it renders Success / Failure natively.
  const message = await actor.rollSavingThrow(SAVE_ID, { dc, skipDialog: SKIP_DIALOG });
  if (!message) { shared.reject = true; return; } // dialog cancelled — abort the use

  const total = message.rolls?.[0]?.total;
  if (!Number.isFinite(total) || total < dc) return; // failed, or unreadable — buff stays

  // Success. Name first: if the buff is configured to auto-delete on toggle-off,
  // `item` (and item.name) is gone the moment setActive lands.
  const name = item.name;
  await ChatMessage.create({
    speaker: ChatMessage.getSpeaker({ actor }),
    content: `<p><strong>${actor.name}</strong> shakes it off — ${name} ends.</p>`,
  });
  await item.setActive(false);
