  description:
    instructions: ''
    value: <p>Your weapon is lodged in your enemy. You cannot make attacks with it. You can attempt to remove it with a DC 10 strength check. If you succeed, you deal damage equal to the attack that lodged it (not including critical damage).</p><p>So long as you hold the weapon, your movement is restricted - your movement must remain within the weapon's reach of the stuck target. Attemps to drag, reposition, or bull rush your target are made with advantage and do not provoke attacks of opportunity so long as the weapon remains stuck.</p><p>You may make an attempt to remove the weapon as a free action immediately after it is lodged.</p><p>You may make a Strength check as an attack of opportunity if your opponent attempts to remove the weapon - If you exceed their check to remove it, you may force it to remain lodged instead.</p>
