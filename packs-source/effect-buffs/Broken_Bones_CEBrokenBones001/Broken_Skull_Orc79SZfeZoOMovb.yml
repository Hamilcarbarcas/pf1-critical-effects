  description:
    instructions: ''
    value: <p>A broken skull represents a crack or break of the skull significant enough to be paired with damage and/or inflammation to the brain. </p><p>The character's hit point total is reduced to zero (before the damage from the breaking attack is applied, putting them into the negative), and they suffer 2d4 <span class="world-variable world-variable-string condition-ability-damage"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/conditions-article#ability_damaged" target="_blank">Ability Damage</a></span> to both <span class="world-variable world-variable-string ability-score-intelligence"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/ability-scores-article#intelligence" target="_blank">Intelligence</a></span> and <span class="world-variable world-variable-string ability-score-wisdom"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/ability-scores-article#wisdom" target="_blank">Wisdom</a></span> (roll each separately).</p><p>A broken skull can be healed by making a DC 20 Heal check to set the bone, followed by 40 points of healing dedicated to the break (dedicated healing does not heal hit point damage) and one full day of bed-rest. a @UUID[Compendium.pf1.spells.Item.anya5qwdjhdfyk8u]{Restoration } spell can be used in place of a full day of bed-rest.</p>
