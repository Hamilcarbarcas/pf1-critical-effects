  description:
    instructions: ''
    value: <p>A broken knee is difficult and painful to bend or put any amount of weight on. <a data-article-privacy="public" data-article-id="34340b9b-7215-410b-a17a-992036d613f0" data-template-type="article" class="article-link article-explorer-link tooltipstered" data-article="34340b9b-7215-410b-a17a-992036d613f0" href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/movement-article">Movement</a> is reduced to 5 feet, running and charging is impossible, a -6 penalty is applied to AC, and <span class="world-variable world-variable-string ability-score-dexterity"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/ability-scores-article#dexterity" target="_blank">Dexterity</a> checks that involve movement or footwork automatically fail</span>.</p><p>A character with a broken knee can move at half their normal movement rate with the aid of crutches.</p><p>A character with both knees broken is also considered flat-footed, and cannot stand or walk unaided.</p><p>A broken knee can be healed by making a DC 20 Heal check to set the break, followed by 20 points of healing dedicated to the break (dedicated healing does not heal hit point damage).</p>
