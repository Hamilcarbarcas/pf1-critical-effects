  description:
    instructions: ''
    value: <p>A shattered neck is debilitating at best, and often life threatening.</p><p>The character immediately makes a DC 20 <span class="world-variable world-variable-string saving-throw-fortitude-save"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/saving-throws-article#fortitude_save" target="_blank">Fortitude Save</a></span> or dies.</p><p>If the save succeeds, their hit point total is reduced to zero (before the damage from the shattering attack is applied, putting them into the negative), and they are <span class="world-variable world-variable-string condition-paralyzed"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/conditions-article#paralyzed" target="_blank">Paralyzed</a></span> until the neck is healed.</p><p>A shattered neck can be healed by making a DC 25 Heal check to set the bone, followed by 80 points of healing dedicated to the break (dedicated healing does not heal hit point damage) and five full days of bed-rest. a @UUID[Compendium.pf1.spells.Item.anya5qwdjhdfyk8u]{Restoration } spell can be used in place of a full day of bed-rest.</p>
