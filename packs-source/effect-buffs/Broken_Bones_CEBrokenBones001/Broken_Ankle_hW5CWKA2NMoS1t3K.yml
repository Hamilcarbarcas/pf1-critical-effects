  description:
    instructions: ''
    value: <p>A broken ankle is difficult and painful to put any amount of weight on. <a data-article-privacy="public" data-article-id="34340b9b-7215-410b-a17a-992036d613f0" data-template-type="article" class="article-link article-explorer-link tooltipstered" data-article="34340b9b-7215-410b-a17a-992036d613f0" href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/movement-article">Movement</a> rates are halved, a -2 penalty is applied to AC and <span class="world-variable world-variable-string ability-score-dexterity"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/ability-scores-article#dexterity" target="_blank">Dexterity</a> checks that involve movement</span>, and the character cannot run or charge.</p><p>A character with both ankles broken instead takes a -4 penalty to AC and <span class="world-variable world-variable-string ability-score-dexterity"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/ability-scores-article#dexterity" target="_blank">Dexterity</a></span> checks that involve movement, and has a movement rate of 5 feet.</p><p>A broken ankle can be healed by making a DC 15 Heal check to set the break, followed by 15 points of healing dedicated to the break (dedicated healing does not heal hit point damage).</p>
