  description:
    instructions: ''
    value: <p>A broken back involves a break in the vertebrae of the spine, and is severely debilitating.</p><p><a data-article-privacy="public" data-article-id="34340b9b-7215-410b-a17a-992036d613f0" data-template-type="article" class="article-link article-explorer-link tooltipstered" data-article="34340b9b-7215-410b-a17a-992036d613f0" href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/movement-article">Movement</a> is set to 0 and the character suffers a -8 penalty to attack rolls and strength and dexterity checks, as well as a -4 penalty to AC.</p><p>If a character with a broken back would be given the broken back condition again, they gain the @UUID[Compendium.pf1-critical-effects.effect-buffs.Item.mxJgNxUw7r8X1hAi]{Shattered Back} condition instead.</p><p>A broken back can be healed by making a DC 15 Heal check to set the bone, followed by 30 points of healing dedicated to the break (dedicated healing does not heal hit point damage) and two full days of bed-rest. a @UUID[Compendium.pf1.spells.Item.anya5qwdjhdfyk8u]{Restoration } spell can be used in place of a full day of bed-rest.</p>
