  description:
    instructions: ''
    value: <p>A shattered back involves extensive damage to the vertebrae of the spine, and renders a creature nearly <span class="world-variable world-variable-string condition-helpless"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/conditions-article#helpless" target="_blank">Helpless</a></span>.</p><p><a data-article-privacy="public" data-article-id="34340b9b-7215-410b-a17a-992036d613f0" data-template-type="article" class="article-link article-explorer-link tooltipstered" data-article="34340b9b-7215-410b-a17a-992036d613f0" href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/movement-article">Movement</a> is set to 0, the character cannot stand without assistance, their <span class="world-variable world-variable-string ability-score-dexterity"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/ability-scores-article#dexterity" target="_blank">Dexterity</a></span> is set to 1, they suffer a -6 penalty to AC, and they must suceed on a DC 15 <span class="world-variable world-variable-string saving-throw-fortitude-save"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/saving-throws-article#fortitude_save" target="_blank">Fortitude Save</a></span> in order to make an attack, cast a spell, or perform any other similar task using only their upper body. When they are able to do so, any check or attack roll made as part of the action is done at a -8 penalty.</p><p>A shattered back can be healed by making a DC 20 Heal check to set the bone, followed by 60 points of healing dedicated to the break (dedicated healing does not heal hit point damage) and five full days of bed-rest. a @UUID[Compendium.pf1.spells.Item.anya5qwdjhdfyk8u]{Restoration } spell can be used in place of a full day of bed-rest.</p>
