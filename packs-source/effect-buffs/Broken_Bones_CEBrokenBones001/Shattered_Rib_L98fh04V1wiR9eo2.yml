  description:
    instructions: ''
    value: <p>A shattered rib make breathing and strenuous activity even more difficult.</p><p>The character is <span class="world-variable world-variable-string condition-fatigued"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/conditions-article#fatigued" target="_blank">Fatigued</a></span> until the rib is healed, has a -4 penalty to attack and AC, and takes an additional 2d6 nonlethal damage whenever hit by an attack.</p><p>A shattered rib can be healed by making a DC 15 Heal check to set the bones, followed by 40 points of healing dedicated to the break (dedicated healing does not heal hit point damage) and two full days of bed-rest. a @UUID[Compendium.pf1.spells.Item.anya5qwdjhdfyk8u]{Restoration } spell can be used in place of a full day of bed-rest.</p>
