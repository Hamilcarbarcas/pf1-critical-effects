  description:
    instructions: ''
    value: <p>A broken neck involves a break in the spine between the shoulders and head, and is severely debilitating.</p><p>The character immediately takes temporary damage equal to their current hit point total, and is <span class="world-variable world-variable-string condition-paralyzed"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/conditions-article#paralyzed" target="_blank">Paralyzed</a></span> until the neck is healed.</p><p>A broken neck can be healed by making a DC 20 Heal check to set the bone, followed by 40 points of healing dedicated to the break (dedicated healing does not heal hit point damage) and two full days of bed-rest. a @UUID[Compendium.pf1.spells.Item.anya5qwdjhdfyk8u]{Restoration } spell can be used in place of a full day of bed-rest.</p>
