  description:
    instructions: ''
    value: <p>A broken arm covers any break between the shoulder and wrist, and makes it difficult to use the arm or hand effectively.</p><p>A -6 penalty is incurred to any roll relying on the use of said arm.</p><p>Whenever a broken arm is used in an attack or skill check, make a DC 10 Fortitude save. Failure turns the broken arm into a @UUID[Compendium.pf1-critical-effects.effect-buffs.Item.indkK9vv0zFP4vCV]{Shattered Arm}.</p><p>A broken arm can be healed by making a DC 10 Heal check to set the bone, followed by 15 points of healing dedicated to the break (dedicated healing does not heal hit point damage).</p>
