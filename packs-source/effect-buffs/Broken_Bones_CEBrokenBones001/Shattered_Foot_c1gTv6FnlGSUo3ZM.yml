  description:
    instructions: ''
    value: <p>A shattered foot involves compound breaks of multiple foot and/or ankle bones. it is painful to the touch and impossible to put weight on.</p><p><a data-article-privacy="public" data-article-id="34340b9b-7215-410b-a17a-992036d613f0" data-template-type="article" class="article-link article-explorer-link tooltipstered" data-article="34340b9b-7215-410b-a17a-992036d613f0" href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/movement-article">Movement</a> rates are quartered, a -4 penalty is applied to AC and <span class="world-variable world-variable-string ability-score-dexterity"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/ability-scores-article#dexterity" target="_blank">Dexterity</a> checks that involve movement</span>, and running is impossible.</p><p>A character with both feet shattered cannot stand or walk unaided, and is always considered flat-footed.</p><p>A shattered foot can be healed by making a DC 15 Heal check to set the bone, followed by 30 points of healing dedicated to the break (dedicated healing does not heal hit point damage) and at least one long rest. A @UUID[Compendium.pf1.spells.Item.fxz69pwpqt9b6uss]{Restoration, Lesser} spell can be used in place of a long rest.</p>
