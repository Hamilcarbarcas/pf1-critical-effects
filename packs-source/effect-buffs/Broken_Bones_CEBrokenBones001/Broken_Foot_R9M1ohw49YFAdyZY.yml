  description:
    instructions: ''
    value: <p>A broken foot is difficult and painful to put any amount of weight on. <a data-article-privacy="public" data-article-id="34340b9b-7215-410b-a17a-992036d613f0" data-template-type="article" class="article-link article-explorer-link tooltipstered" data-article="34340b9b-7215-410b-a17a-992036d613f0" href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/movement-article">Movement</a> rates are halved, and a -2 penalty is applied to AC and <span class="world-variable world-variable-string ability-score-dexterity"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/ability-scores-article#dexterity" target="_blank">Dexterity</a> checks that involve movement</span>.</p><p>A character with both feet broken instead takes a -4 penalty to AC and <span class="world-variable world-variable-string ability-score-dexterity"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/ability-scores-article#dexterity" target="_blank">Dexterity</a></span> checks that involve movement, and has a movement rate of 5 feet.</p><p>A character with a broken foot may elect to move at full speed, and even take a <span class="world-variable world-variable-string actions-in-combat-run"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/actions-in-combat-article#run" target="_blank">Run</a></span> action, but they must make a DC 10 <span class="world-variable world-variable-string saving-throw-fortitude-save"><a href="https://www.worldanvil.com/w/astora-hamilcarbarca/a/saving-throws-article#fortitude_save" target="_blank">Fortitude Save</a></span> after each such act or turn their broken foot into a @UUID[Compendium.pf1-critical-effects.effect-buffs.Item.c1gTv6FnlGSUo3ZM]{Shattered Foot}.</p><p>A broken foot can be healed by making a DC 10 Heal check to set the bone, followed by 10 points of healing dedicated to the break (dedicated healing does not heal hit point damage).</p>
