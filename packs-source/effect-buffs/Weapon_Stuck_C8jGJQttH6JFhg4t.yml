  description:
    instructions: ''
    value: <p><em>A stuck weapon remains lodged in the wound, preventing healing and threatening further damage.</em></p><p>While the weapon is stuck, you take a -2 penalty on all attack rolls, and if the attacker maintains hold of the weapon you are anchored to the attacker - you cannot move out of reach of the weapon.</p><p>Any bleeds or ongoing injuries caused by the attack cannot be healed until the weapon is removed. This includes the application of dedicated healing to the injury.</p><p>A stuck weapon can be removed by succeeding on a DC 10 Strength Check as a Move Action. If removed in this way, it deals damage to you equal to the damage dealt by the attack that caused it.</p><p>A stuck weapon can also be removed by using the Heal skill (DC 20, 1 minute action). On success, the weapon is removed without further damage. Pass or fail, further bleed damage does not occur during this action so long as the check beat a DC of 10.</p>
