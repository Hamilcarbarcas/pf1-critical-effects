      name: Strength Check
      type: script
      value: |-
        const result = await actor.rollAbilityTest("str");
        if (!result) {
            shared.reject = true;
            return;
        }

        shared.skipDialog = true;

        const roll = result.rolls?.[0];
        const total = roll?.total;

        if (total < 10)
        {
           shared.reject = true;
           return;
        }
