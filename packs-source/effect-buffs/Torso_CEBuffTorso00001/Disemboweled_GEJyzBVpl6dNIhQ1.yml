    instructions: ''
    value: <p>Your stomach has been sliced open, spilling your internal organs.</p><p>You take 1d4 constitution damage each round your internals are spilled.</p><p>As a full-round action your internals can be replaced within your stomach. If you attempt this yourself, you must make a DC 15 Fortitude Save to do so.</p><p>It is a move action each round to hold them in, and requires at least one hand to do so. If they are not held in for a round, they spill back out and you resume taking constitution damage.</p>
